[package]
name = "glide"
version = "0.2.0"
edition = "2024"
description = "Polished screen recordings and screenshots for Linux Wayland desktops"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "file_chooser"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
egui = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false }
jiff = "0.2.37"
nix = { version = "0.31.3", features = ["signal", "poll", "fs"] }
pipewire = "0.10.1"
pollster = "1.0.1"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
x11rb = { version = "0.14.0", features = ["composite", "xinput", "shape", "allow-unsafe-code", "dl-libxcb"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
